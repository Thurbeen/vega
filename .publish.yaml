version: 1
forge: github
base: main
review:
  rules:
    - AGENTS.md
    - BOOTSTRAP.md
gate:
  - name: starter
    run: uv run --no-project python -m unittest discover -s tests -v
    instructions: Set FLEET_BIN to an absolute path of a Fleet v2.10.0-compatible executable and have jq installed; v2.5 and older lack the parent-label relay into the parent Task's inbox, and v2.2.0 and older lack the repositories workspace or its hot reload. The test must use the real binary with FakeRuntime or its recording thurbox-cli stand-in, never a live harness session.
  - name: hooks
    run: prek run --all-files
ci:
  required: false

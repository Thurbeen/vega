version: 1
forge: github
base: main
review:
  rules:
    - AGENTS.md
gate:
  - name: vega
    run: uv run --no-project python -m unittest discover -s tests -v
    instructions: Set FLEET_BIN to an absolute path of a Fleet v3 executable, with jq on PATH; put pwsh on PATH to cover install.ps1. The tests use the real binary and the fake runtime, never a live harness session.
  - name: hooks
    run: prek run --all-files
ci:
  required: false
